name: De Heeren product images
on:
  push:
    branches: [de-heeren-assets]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - name: Download every product image from the shop
        run: python fetch.py
      - name: Commit images
        run: |
          git config user.name "assets-bot"
          git config user.email "assets-bot@users.noreply.github.com"
          git add -A
          git commit -m "De Heeren product images" || echo "nothing to commit"
          git push
